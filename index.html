<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد مخطط الشنطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#EDE6D3;
    --paper:#FBF7EE;
    --ink:#2A2621;
    --ink-soft:#5C544A;
    --line:#C9BBA0;
    --stitch:#A6383B;
    --chalk:#3E5C76;
    --grid: rgba(42,38,33,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--canvas);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(42,38,33,0.08) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding:28px 18px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}
  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;margin-bottom:22px;
  }
  header h1{
    margin:0;font-size:30px;font-weight:900;letter-spacing:-0.3px;
  }
  header h1 span{color:var(--stitch);}
  header p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;}
  .badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--ink-soft);
    border:1px dashed var(--line);
    padding:5px 10px;border-radius:3px;
    background:var(--paper);
  }
  .grid{
    display:grid;grid-template-columns: 380px 1fr;gap:22px;
  }
  @media (max-width:900px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px;
    margin-bottom:18px;
    box-shadow: 0 1px 0 rgba(42,38,33,0.04);
  }
  .card h2{
    font-size:13px;text-transform:uppercase;letter-spacing:1px;
    margin:0 0 14px;color:var(--ink-soft);
    display:flex;align-items:center;gap:8px;
  }
  .card h2::before{
    content:"";width:16px;height:2px;background:var(--stitch);display:inline-block;
  }

  table.items{width:100%;border-collapse:collapse;font-size:13px;}
  table.items th{
    text-align:right;font-weight:500;color:var(--ink-soft);
    font-size:11px;padding:0 4px 6px;border-bottom:1px solid var(--line);
  }
  table.items td{padding:4px 3px;vertical-align:middle;}
  table.items input{
    width:100%;border:1px solid var(--line);background:#fff;
    border-radius:4px;padding:6px 6px;font-family:'JetBrains Mono',monospace;
    font-size:12.5px;color:var(--ink);
  }
  table.items input.name-input{font-family:'Tajawal',sans-serif;}
  .del-btn{
    background:none;border:none;color:var(--stitch);cursor:pointer;
    font-size:16px;line-height:1;padding:4px;
  }
  .add-row{
    margin-top:10px;width:100%;padding:9px;
    border:1.5px dashed var(--stitch);border-radius:4px;
    background:transparent;color:var(--stitch);font-weight:700;
    cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;
  }
  .add-row:hover{background:rgba(166,56,59,0.06);}

  .field{margin-bottom:12px;}
  .field label{
    display:flex;justify-content:space-between;font-size:12.5px;
    color:var(--ink-soft);margin-bottom:5px;
  }
  .field label b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:700;}
  .field input[type=range]{width:100%;accent-color:var(--stitch);}
  .field input[type=number]{
    width:100%;border:1px solid var(--line);background:#fff;
    border-radius:4px;padding:8px;font-family:'JetBrains Mono',monospace;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .toggle{
    display:flex;gap:8px;margin-bottom:14px;
  }
  .toggle button{
    flex:1;padding:8px;border:1px solid var(--line);background:#fff;
    border-radius:4px;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:12.5px;
    color:var(--ink-soft);
  }
  .toggle button.active{
    background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;
  }

  .generate-btn{
    width:100%;padding:13px;background:var(--ink);color:var(--paper);
    border:none;border-radius:4px;font-size:15px;font-weight:900;
    cursor:pointer;letter-spacing:0.3px;
  }
  .generate-btn:hover{background:#3a352c;}

  .stat-strip{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:6px;
    overflow:hidden;margin-bottom:18px;
  }
  .stat{background:var(--paper);padding:14px 12px;text-align:center;}
  .stat .v{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--stitch);}
  .stat .l{font-size:11px;color:var(--ink-soft);margin-top:3px;}

  #patternHost{
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:14px;overflow:auto;
  }
  #patternHost svg{display:block;margin:0 auto;max-width:100%;height:auto;}

  table.panels{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px;}
  table.panels th{
    text-align:right;font-size:11px;color:var(--ink-soft);
    padding:6px 8px;border-bottom:2px solid var(--ink);text-transform:uppercase;letter-spacing:0.5px;
  }
  table.panels td{
    padding:8px;border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;
  }
  table.panels td.name{font-family:'Tajawal',sans-serif;font-weight:500;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;margin-left:6px;}

  .print-btn{
    margin-top:14px;padding:10px 16px;background:transparent;
    border:1.5px solid var(--ink);border-radius:4px;color:var(--ink);
    font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;
  }
  .print-btn:hover{background:var(--ink);color:var(--paper);}

  @media print{
    body{background:#fff;padding:0;}
    .card:not(#patternCard){display:none;}
    header .badge{display:none;}
    .print-btn{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>مولّد مخطط <span>الشنطة</span></h1>
      <p>حط مقاسات أغراضك، وطلّع مخطط قص جاهز تسلّمه للمصنع</p>
    </div>
    <div class="badge">PATTERN DRAFT v1.0</div>
  </header>

  <div class="grid">
    <!-- LEFT: INPUTS -->
    <div>
      <div class="card">
        <h2>أغراضك</h2>
        <table class="items" id="itemsTable">
          <thead>
            <tr>
              <th style="width:26%">الاسم</th>
              <th>طول</th><th>عرض</th><th>ارتفاع</th><th>عدد</th><th></th>
            </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>
        <button class="add-row" id="addRowBtn">+ إضافة غرض</button>
      </div>

      <div class="card">
        <h2>ترتيب الأغراض داخل الشنطة</h2>
        <div class="toggle" id="stackToggle">
          <button data-mode="stack" class="active">فوق بعض (مكدّسة)</button>
          <button data-mode="side">جنب بعض</button>
        </div>

        <div class="field">
          <label>هامش راحة حول الأغراض <b id="paddingVal">2 سم</b></label>
          <input type="range" id="padding" min="0" max="8" value="2" step="0.5">
        </div>
        <div class="field">
          <label>هامش الخياطة (Seam Allowance) <b id="seamVal">1 سم</b></label>
          <input type="range" id="seam" min="0.5" max="3" value="1" step="0.5">
        </div>
        <div class="row2">
          <div class="field">
            <label>طول قبضة الشنطة</label>
            <input type="number" id="handleLen" value="55">
          </div>
          <div class="field">
            <label>عرض القماش المتوفر</label>
            <input type="number" id="fabricWidth" value="150">
          </div>
        </div>
      </div>

      <button class="generate-btn" id="genBtn">توليد المخطط</button>
    </div>

    <!-- RIGHT: OUTPUT -->
    <div>
      <div class="stat-strip">
        <div class="stat"><div class="v" id="statDims">—</div><div class="l">مقاس الشنطة الداخلي (سم)</div></div>
        <div class="stat"><div class="v" id="statFabric">—</div><div class="l">طول القماش المطلوب</div></div>
        <div class="stat"><div class="v" id="statArea">—</div><div class="l">إجمالي المساحة</div></div>
      </div>

      <div class="card" id="patternCard">
        <h2>مخطط القص</h2>
        <div id="patternHost"></div>
        <button class="print-btn" id="printBtn">🖨 طباعة / تصدير PDF</button>
      </div>

      <div class="card">
        <h2>قطع النمط</h2>
        <table class="panels" id="panelsTable">
          <thead><tr><th>القطعة</th><th>المقاس النهائي</th><th>مقاس القص (+هامش)</th><th>العدد</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let items = [
  {name:"لابتوب", l:35, w:25, h:3, q:1},
  {name:"دفتر", l:25, w:18, h:2, q:2},
];
let stackMode = "stack";

const itemsBody = document.getElementById('itemsBody');
const paddingEl = document.getElementById('padding');
const seamEl = document.getElementById('seam');

function renderItems(){
  itemsBody.innerHTML = '';
  items.forEach((it, i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="name-input" value="${it.name}" data-i="${i}" data-f="name"></td>
      <td><input type="number" step="0.5" value="${it.l}" data-i="${i}" data-f="l"></td>
      <td><input type="number" step="0.5" value="${it.w}" data-i="${i}" data-f="w"></td>
      <td><input type="number" step="0.5" value="${it.h}" data-i="${i}" data-f="h"></td>
      <td><input type="number" step="1" value="${it.q}" data-i="${i}" data-f="q"></td>
      <td><button class="del-btn" data-i="${i}">✕</button></td>
    `;
    itemsBody.appendChild(tr);
  });
  itemsBody.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.i, f = e.target.dataset.f;
      items[i][f] = (f==='name') ? e.target.value : parseFloat(e.target.value)||0;
    });
  });
  itemsBody.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      items.splice(+e.target.dataset.i,1);
      renderItems();
    });
  });
}

document.getElementById('addRowBtn').addEventListener('click', ()=>{
  items.push({name:"غرض جديد", l:20, w:15, h:5, q:1});
  renderItems();
});

document.getElementById('stackToggle').addEventListener('click', e=>{
  if(e.target.tagName!=='BUTTON') return;
  stackMode = e.target.dataset.mode;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
});

paddingEl.addEventListener('input', ()=> document.getElementById('paddingVal').textContent = paddingEl.value+' سم');
seamEl.addEventListener('input', ()=> document.getElementById('seamVal').textContent = seamEl.value+' سم');

function computeBagDims(){
  const pad = parseFloat(paddingEl.value);
  if(items.length===0) return {L:30,W:15,H:20};
  let maxL = Math.max(...items.map(i=>i.l));
  let maxW = Math.max(...items.map(i=>i.w));
  let H;
  if(stackMode==='stack'){
    H = items.reduce((s,i)=> s + i.h*i.q, 0);
  } else {
    H = Math.max(...items.map(i=>i.h));
    maxW = items.reduce((s,i)=> s + i.w*i.q, 0);
  }
  return { L: Math.round((maxL+pad)*2)/2, W: Math.round((maxW+pad)*2)/2, H: Math.round((H+pad)*2)/2 };
}

function buildPanels(dims){
  const seam = parseFloat(seamEl.value);
  const handleLen = parseFloat(document.getElementById('handleLen').value)||50;
  const {L,W,H} = dims;
  const raw = [
    {name:"القاعدة", w:L, h:W, qty:1, color:'#A6383B'},
    {name:"اللوح الأمامي", w:L, h:H, qty:1, color:'#3E5C76'},
    {name:"اللوح الخلفي", w:L, h:H, qty:1, color:'#3E5C76'},
    {name:"اللوح الجانبي", w:W, h:H, qty:2, color:'#6B7A3D'},
    {name:"شريط فتحة الأعلى", w:2*(L+W)+4, h:6, qty:1, color:'#8A7048'},
    {name:"القبضة", w:handleLen, h:6, qty:2, color:'#2A2621'},
  ];
  raw.forEach(p=>{
    p.cutW = Math.round((p.w + 2*seam)*10)/10;
    p.cutH = Math.round((p.h + 2*seam)*10)/10;
  });
  return raw;
}

function packShelves(panels, fabricWidth){
  let flat = [];
  panels.forEach(p=>{
    for(let k=0;k<p.qty;k++) flat.push({label:p.name, w:p.cutW, h:p.cutH, color:p.color});
  });
  flat.sort((a,b)=> b.h - a.h);
  let x=0, y=0, shelfH=0, placements=[], maxWidth=0;
  flat.forEach(item=>{
    let w=item.w, h=item.h;
    if(w>fabricWidth && h<=fabricWidth){ [w,h]=[h,w]; }
    if(x + w > fabricWidth){
      y += shelfH;
      x = 0; shelfH = 0;
    }
    placements.push({...item, x, y, w, h});
    x += w;
    shelfH = Math.max(shelfH, h);
    maxWidth = Math.max(maxWidth, x);
  });
  y += shelfH;
  return { placements, totalLength: y, usedWidth: maxWidth };
}

function svgPattern(placements, fabricWidth, totalLength){
  const scale = Math.min(680/fabricWidth, 780/totalLength);
  const W = fabricWidth*scale, H = totalLength*scale;
  const pad = 24;
  let body = '';
  // fabric outline
  body += `<rect x="0" y="0" width="${W}" height="${H}" fill="#F5F1E4" stroke="#2A2621" stroke-width="2"/>`;
  // registration marks (corners)
  [[0,0],[W,0],[0,H],[W,H]].forEach(([cx,cy])=>{
    body += `<g stroke="#2A2621" stroke-width="1.4">
      <line x1="${cx-7}" y1="${cy}" x2="${cx+7}" y2="${cy}"/>
      <line x1="${cx}" y1="${cy-7}" x2="${cx}" y2="${cy+7}"/>
    </g>`;
  });
  placements.forEach((p,idx)=>{
    const px = p.x*scale, py = p.y*scale, pw = p.w*scale, ph = p.h*scale;
    body += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}"
        fill="${p.color}22" stroke="${p.color}" stroke-width="1.6"/>`;
    // dashed seam line inset
    const inset = Math.min(6, pw*0.08, ph*0.08);
    if(pw>18 && ph>18){
      body += `<rect x="${px+inset}" y="${py+inset}" width="${pw-2*inset}" height="${ph-2*inset}"
        fill="none" stroke="${p.color}" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>`;
    }
    const fs = Math.max(8, Math.min(11, pw/9));
    if(pw>30 && ph>16){
      body += `<text x="${px+pw/2}" y="${py+ph/2-4}" text-anchor="middle"
        font-family="Tajawal" font-size="${fs}" fill="#2A2621" font-weight="700">${p.label}</text>`;
      body += `<text x="${px+pw/2}" y="${py+ph/2+11}" text-anchor="middle"
        font-family="JetBrains Mono" font-size="${fs-1}" fill="#5C544A">${Math.round(p.w)}×${Math.round(p.h)}</text>`;
    }
    // grainline arrow on the base panel (first placed of القاعدة) — signature detail
    if(p.label==='القاعدة' && idx===placements.findIndex(x=>x.label==='القاعدة')){
      const midx = px+pw/2, top=py+ph*0.2, bot=py+ph*0.8;
      body += `<g stroke="#2A2621" stroke-width="1.2" fill="#2A2621">
        <line x1="${midx}" y1="${top}" x2="${midx}" y2="${bot}"/>
        <polygon points="${midx-4},${top+7} ${midx+4},${top+7} ${midx},${top}"/>
        <polygon points="${midx-4},${bot-7} ${midx+4},${bot-7} ${midx},${bot}"/>
      </g>`;
    }
  });
  return `<svg viewBox="0 0 ${W+pad} ${H+pad}" xmlns="http://www.w3.org/2000/svg" width="${W+pad}" height="${H+pad}">
    <g transform="translate(${pad/2},${pad/2})">${body}</g>
  </svg>`;
}

function render(){
  const dims = computeBagDims();
  const panels = buildPanels(dims);
  const fabricWidth = parseFloat(document.getElementById('fabricWidth').value)||150;
  const {placements, totalLength} = packShelves(panels, fabricWidth);

  document.getElementById('statDims').textContent = `${dims.L}×${dims.W}×${dims.H}`;
  document.getElementById('statFabric').textContent = (Math.ceil(totalLength/10)/10 * 1.1).toFixed(1)+' م';
  const totalArea = panels.reduce((s,p)=> s + (p.cutW*p.cutH*p.qty), 0)/10000;
  document.getElementById('statArea').textContent = totalArea.toFixed(2)+' م²';

  document.getElementById('patternHost').innerHTML = svgPattern(placements, fabricWidth, totalLength);

  const tbody = document.querySelector('#panelsTable tbody');
  tbody.innerHTML = '';
  panels.forEach(p=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="name"><span class="swatch" style="background:${p.color}"></span>${p.name}</td>
      <td>${p.w}×${p.h} سم</td>
      <td>${p.cutW}×${p.cutH} سم</td>
      <td>${p.qty}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('genBtn').addEventListener('click', render);
document.getElementById('printBtn').addEventListener('click', ()=> window.print());

renderItems();
render();
</script>
</body>
</html>
